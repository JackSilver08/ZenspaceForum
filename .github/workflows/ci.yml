name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  api:
    name: Go build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.mod
      - name: Build and test backend
        working-directory: apps/api
        run: |
          go mod tidy
          go vet ./...
          go test ./...
          go build ./cmd/server
  web:
    name: React build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate light editorial design contracts
        run: python3 scripts/check_stitch_design.py
      - name: Install dependencies and build
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund
          npm run build
  docker-smoke:
    name: Docker Compose + HTTP smoke test
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare test environment
        run: |
          echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          mkdir -p data/uploads
      - name: Validate Docker Compose contract
        run: |
          docker compose config --quiet
          python3 scripts/check_compose.py
      - name: Reproduce Windows CRLF checkout before Docker build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("apps/api/docker-entrypoint.sh")
          content = p.read_bytes().replace(b"\r\n", b"\n").replace(b"\n", b"\r\n")
          p.write_bytes(content)
          assert b"#!/bin/sh\r\n" == content[:11], "Failed to reproduce Windows CRLF file"
          print("CRLF injected into Docker build input")
          PY
      - name: Boot the entire application
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Verify app through real HTTP
        run: python3 scripts/smoke.py
      - name: Simulate optional Redis outage
        run: |
          docker compose stop redis
          python3 scripts/test_redis_outage.py
      - name: Diagnostics
        if: always()
        run: |
          docker compose ps || true
          docker compose logs --tail=120 db redis backend web || true
      - name: Stop containers (preserve volumes)
        if: always()
        run: docker compose down || true
  windows-launcher:
    name: Windows PowerShell launcher syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify shell scripts checkout as LF on Windows
        shell: powershell
        run: |
          $files = @(Get-ChildItem -Path . -Recurse -Filter '*.sh' -File)
          if (-not (Test-Path 'apps/api/docker-entrypoint.sh')) {
            throw 'Required backend entrypoint missing.'
          }
          if ($files.Count -eq 0) { throw 'No shell scripts found.' }
          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            if ([Array]::IndexOf($bytes, [byte]13) -ge 0) {
              throw "Shell file contains CRLF: $($file.FullName)"
            }
          }
          Write-Host 'Shell files use LF on Windows as required by .gitattributes.'
      - name: Parse script with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\Test-PowerShellSyntax.ps1
      - name: Parse script with PowerShell 7
        shell: pwsh
        run: .\scripts\Test-PowerShellSyntax.ps1
