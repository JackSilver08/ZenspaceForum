name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  api:
    name: Go build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.mod
      - name: Build and test backend
        working-directory: apps/api
        run: |
          go mod tidy
          go vet ./...
          go test ./...
          go build ./cmd/server
  web:
    name: React build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and build
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund
          npm run build
  docker-smoke:
    name: Docker Compose + HTTP smoke test
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare test environment
        run: |
          echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          mkdir -p data/uploads
      - name: Validate Docker Compose contract
        run: |
          docker compose config --quiet
          python3 scripts/check_compose.py
      - name: Boot the entire application
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Verify app through real HTTP
        run: python3 scripts/smoke.py
      - name: Diagnostics
        if: always()
        run: |
          docker compose ps || true
          docker compose logs --tail=120 db redis backend web || true
      - name: Stop containers (preserve volumes)
        if: always()
        run: docker compose down || true
